# EasyTier for Magisk 运行配置
# 本文件是 shell 脚本，修改后点击 Magisk 模块的“操作”按钮重启生效。
# 首次安装后位于 /data/adb/easytier-magisk/module.conf，升级模块不会覆盖。

# ── 组网配置 ────────────────────────────────────────────────────────────
# 配置文件路径。若同目录下存在非空的 command_args，则优先使用 command_args，
# 此时本项被忽略（command_args 里可以写 easytier-core 的任意官方参数）。
CONFIG_FILE=/data/adb/easytier-magisk/config.toml

# 自动/自定义主机名。留空 = 使用“品牌-型号”；config.toml 已写 hostname 时不覆盖。
CUSTOM_HOSTNAME=

# easytier-cli 连接的 RPC 地址，供“操作”按钮查看节点状态使用。
RPC_PORTAL=127.0.0.1:15888

# ── 日志 ────────────────────────────────────────────────────────────────
LOG_DIR=/data/adb/easytier-magisk/log
# core 文件日志级别（trace/debug/info/warn/error）与轮转参数，对应官方
# --file-log-level/--file-log-size/--file-log-count。
EASYTIER_LOG_LEVEL=info
EASYTIER_CONSOLE_LEVEL=warn
EASYTIER_LOG_SIZE_MB=10
EASYTIER_LOG_COUNT=3
# 控制台日志大小上限（KB），超过后保留一份 .1。
LOG_MAX_KB=1024

# ── Web 管理界面（easytier-web-embed）───────────────────────────────────
# 1 = 随模块启动官方 Web 管理界面/配置服务器；0 = 关闭。
# 默认只监听本机，需要局域网访问时改成 0.0.0.0。
WEB_ENABLE=0
WEB_ADDR=127.0.0.1
# Web 前端与 REST API 端口。
WEB_PORT=11211
# 配置服务器端口，节点可用 easytier-core -w udp://<设备IP>:22020/<用户名> 接入。
WEB_CONFIG_PORT=22020
WEB_CONFIG_PROTOCOL=udp
# sqlite 数据库路径，保存账号、设备与下发的配置。
WEB_DB=/data/adb/easytier-magisk/web/et.db
# 追加给 easytier-web-embed 的官方参数，支持引号，例如：
# WEB_ARGS="--disable-registration"
WEB_ARGS=

# 1 = 本机 core 由本机 Web 配置服务器托管（此时 config.toml 不再使用）。
# 使用顺序：先保持 0 启动，在 Web 界面注册账号后，把用户名填入
# WEB_MANAGE_TOKEN 并把本项改为 1，重启模块即可在 Web 界面管理本机。
WEB_MANAGE_LOCAL=0
WEB_MANAGE_TOKEN=

# ── 热点/共享网络 NAT ───────────────────────────────────────────────────
# 1 = 把热点、USB 网络共享的客户端流量经 EasyTier 虚拟网络转发
# （源地址改写成虚拟 IP，对端按虚拟网段回程，无需额外配置）。
# 仅处理 IPv4，需要系统存在 iptables。
HOTSPOT_NAT=0
